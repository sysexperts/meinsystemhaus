services:
  meinsystemhaus:
    build: .
    container_name: meinsystemhaus
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/data
    volumes:
      # Persistente SQLite-Datenbank ausserhalb des Containers
      - meinsystemhaus-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  meinsystemhaus-data:
